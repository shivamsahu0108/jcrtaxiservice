<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 512 512" width="512" height="512" role="img"
     aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Jabalpur Car Rental Taxi Service</title>
  <desc id="logoDesc">Premium circular emblem: silver sedan on a curved gold-edged road with Bhedaghat marble rocks and Dhuandhar Falls, black and champagne gold.</desc>

  <defs>
    <!-- Brand palette: #0B0B0A  #191714  #D4AF37  #F7E6A1  #F7F5EF  #C8CCD0 -->

    <linearGradient id="goldMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7E6A1"/>
      <stop offset="0.35" stop-color="#D4AF37"/>
      <stop offset="0.7" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#F7E6A1"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7E6A1"/>
      <stop offset="1" stop-color="#D4AF37"/>
    </linearGradient>

    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F5EF"/>
      <stop offset="1" stop-color="#C8CCD0"/>
    </linearGradient>
    <linearGradient id="hoodGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8CCD0"/>
      <stop offset="0.6" stop-color="#F7F5EF"/>
      <stop offset="1" stop-color="#C8CCD0"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191714"/>
      <stop offset="1" stop-color="#0B0B0A"/>
    </linearGradient>

    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0B0A"/>
      <stop offset="1" stop-color="#191714"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F7E6A1"/>
      <stop offset="1" stop-color="#D4AF37"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="marbleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F5EF"/>
      <stop offset="1" stop-color="#C8CCD0"/>
    </linearGradient>
    <linearGradient id="fallsGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F5EF" stop-opacity="1"/>
      <stop offset="1" stop-color="#F7F5EF" stop-opacity="0.45"/>
    </linearGradient>

    <clipPath id="sceneClip">
      <circle cx="256" cy="256" r="165"/>
    </clipPath>

    <!-- Text paths -->
    <path id="arcTop" d="M 64,256 A 192,192 0 0 1 448,256"/>
    <path id="arcBottom" d="M 46,256 A 210,210 0 0 0 466,256"/>
  </defs>

  <!-- ============ BORDER & BASE ============ -->
  <g id="border">
    <circle cx="256" cy="256" r="254" fill="url(#goldMetal)"/>
    <circle cx="256" cy="256" r="246" fill="#0B0B0A"/>
    <circle cx="256" cy="256" r="243" fill="#191714" stroke="url(#goldMetal)" stroke-width="1.2"/>
    <circle cx="256" cy="256" r="170" fill="#0B0B0A" stroke="url(#goldMetal)" stroke-width="3"/>
  </g>

  <!-- ============ SCENE ============ -->
  <g id="scene" clip-path="url(#sceneClip)">
    <!-- Sky -->
    <rect x="90" y="90" width="332" height="332" fill="url(#skyGrad)"/>
    <circle cx="262" cy="240" r="125" fill="url(#glowGrad)"/>
    <circle cx="262" cy="222" r="50" fill="url(#sunGrad)"/>
    <circle cx="262" cy="222" r="60" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>
    <g fill="#F7E6A1" opacity="0.8">
      <circle cx="170" cy="130" r="1.5"/>
      <circle cx="226" cy="112" r="1.2"/>
      <circle cx="318" cy="124" r="1.5"/>
      <circle cx="352" cy="160" r="1.1"/>
      <circle cx="190" cy="168" r="1"/>
    </g>

    <!-- Ground -->
    <rect x="90" y="268" width="332" height="160" fill="#0B0B0A"/>
    <line x1="90" y1="268" x2="422" y2="268" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>

    <!-- Bhedaghat Marble Rocks: left cliff -->
    <g id="marble-left">
      <polygon fill="url(#marbleGrad)" points="92,276 94,238 108,228 118,208 168,206 178,190 190,200 200,220 214,226 226,276"/>
      <polygon fill="#0B0B0A" opacity="0.3" points="92,276 94,238 108,228 118,208 140,207 134,250 120,276"/>
      <polygon fill="#0B0B0A" opacity="0.18" points="178,190 190,200 200,220 214,226 226,276 204,276 196,226"/>
      <path d="M118,222 L168,220 M104,236 L176,234" stroke="#C8CCD0" stroke-width="1" opacity="0.6" fill="none"/>
    </g>

    <!-- Dhuandhar Falls -->
    <g id="falls">
      <path fill="url(#fallsGrad)" d="M143,208 L157,208 L161,256 L139,256 Z"/>
      <path d="M147,210 L146,254 M152,210 L153,254" stroke="#C8CCD0" stroke-width="1" opacity="0.7" fill="none"/>
    </g>

    <!-- Left front rock layer -->
    <polygon fill="#C8CCD0" points="92,276 98,254 124,248 136,242 150,252 176,246 196,276"/>
    <polygon fill="#0B0B0A" opacity="0.28" points="92,276 98,254 124,248 120,276"/>

    <!-- Mist -->
    <ellipse cx="150" cy="252" rx="26" ry="8" fill="#F7F5EF" opacity="0.55"/>
    <ellipse cx="146" cy="246" rx="14" ry="6" fill="#F7F5EF" opacity="0.5"/>

    <!-- Marble rocks: right cliff -->
    <g id="marble-right">
      <polygon fill="url(#marbleGrad)" points="298,276 300,246 312,232 324,206 344,196 356,214 372,206 388,226 404,236 420,250 426,276"/>
      <polygon fill="#0B0B0A" opacity="0.3" points="372,206 388,226 404,236 420,250 426,276 380,276 376,230"/>
      <polygon fill="#0B0B0A" opacity="0.18" points="298,276 300,246 312,232 324,206 336,236 320,276"/>
      <path d="M312,236 L388,234 M326,222 L360,220" stroke="#C8CCD0" stroke-width="1" opacity="0.6" fill="none"/>
    </g>
    <polygon fill="#C8CCD0" points="298,276 306,256 330,250 346,256 372,252 400,262 426,276"/>
    <polygon fill="#0B0B0A" opacity="0.25" points="372,252 400,262 426,276 380,276"/>

    <!-- Road -->
    <g id="road">
      <path fill="#191714" d="M 40,425 C 70,372 170,330 250,282 C 255,278 258,273 261,268 L 267,268 C 300,300 400,330 500,420 L 500,440 L 40,440 Z"/>
      <path d="M 40,425 C 70,372 170,330 250,282 C 255,278 258,273 261,268" fill="none" stroke="url(#goldMetal)" stroke-width="3"/>
      <path d="M 267,268 C 300,300 400,330 500,420" fill="none" stroke="url(#goldMetal)" stroke-width="3"/>
      <path d="M 264,270 C 235,315 235,351 270,422" fill="none" stroke="#F7F5EF" stroke-width="2.4" stroke-dasharray="9 7" opacity="0.85"/>
    </g>

    <!-- ============ SEDAN (front three-quarter) ============ -->
    <g id="sedan" transform="translate(144 274)">
      <!-- shadow -->
      <ellipse cx="124" cy="91" rx="124" ry="8" fill="#0B0B0A" opacity="0.7"/>

      <!-- lower body (side) -->
      <path d="M74,55 L118,49 L226,47 L233,51 L235,78 L228,83 L74,88 Z" fill="url(#bodyGrad)"/>
      <path d="M74,70 L228,66 L235,78 L228,83 L74,88 Z" fill="#0B0B0A" opacity="0.22"/>

      <!-- greenhouse -->
      <path d="M112,49 L132,19 Q162,11 194,15 L218,46 Z" fill="url(#bodyGrad)"/>
      <path d="M121,47 L136,23 Q160,17 186,20 L206,45 Z" fill="url(#glassGrad)"/>
      <polygon points="156,18 162,18 164,46 158,46" fill="url(#bodyGrad)"/>
      <polygon points="136,23 146,21 134,46 121,47" fill="#F7F5EF" opacity="0.15"/>

      <!-- roof -->
      <path d="M86,19 Q112,10 160,10 L194,15 L132,19 Z" fill="#F7F5EF"/>

      <!-- hood -->
      <path d="M8,57 L74,55 L114,48 L50,45 Z" fill="url(#hoodGrad)"/>
      <path d="M30,56 L82,46" stroke="#191714" stroke-width="1" opacity="0.25" fill="none"/>

      <!-- windshield -->
      <path d="M50,45 L114,48 L132,19 L86,19 Z" fill="url(#bodyGrad)"/>
      <path d="M58,44 L108,47 L124,23 L90,22 Z" fill="url(#glassGrad)"/>
      <polygon points="90,22 102,22 78,44 66,44" fill="#F7F5EF" opacity="0.15"/>

      <!-- front face -->
      <path d="M8,57 L74,55 L74,88 L14,80 Z" fill="url(#bodyGrad)"/>
      <path d="M8,57 L74,55 L74,88 L14,80 Z" fill="#0B0B0A" opacity="0.15"/>
      <!-- grille -->
      <path d="M22,63 L68,62 L68,72 L24,70 Z" fill="#0B0B0A" stroke="#D4AF37" stroke-width="1.2"/>
      <path d="M25,66 L67,66.4 M25,68.6 L67,69.2" stroke="#D4AF37" stroke-width="0.8" opacity="0.6" fill="none"/>
      <circle cx="45" cy="66.5" r="2.6" fill="#D4AF37"/>
      <!-- headlights -->
      <path d="M9,58 L24,58 L22,64 L9,63 Z" fill="#F7F5EF"/>
      <path d="M62,57 L74,56 L74,63 L64,63 Z" fill="#F7F5EF"/>
      <path d="M10,61 L22,61.5 M64,60.5 L74,60" stroke="#D4AF37" stroke-width="1.2" fill="none"/>
      <!-- lower intake -->
      <path d="M26,76 L68,79 L68,84 L28,81 Z" fill="#0B0B0A"/>

      <!-- side details -->
      <path d="M76,60 L118,54 L226,52" stroke="#D4AF37" stroke-width="1.4" fill="none"/>
      <path d="M118,52 L120,82 M160,48 L162,80" stroke="#0B0B0A" stroke-width="1" opacity="0.35" fill="none"/>
      <path d="M130,59 L144,58.5 M170,57.5 L184,57" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <path d="M108,46 L118,44 L119,49 L109,50 Z" fill="#C8CCD0" stroke="#191714" stroke-width="0.8"/>
      <path d="M229,55 L234,54 L235,63 L230,63 Z" fill="#D4AF37"/>

      <!-- front wheel -->
      <g id="wheel-front">
        <ellipse cx="106" cy="76" rx="14.5" ry="18.5" fill="#0B0B0A"/>
        <ellipse cx="106" cy="76" rx="11.5" ry="15.5" fill="#191714" stroke="#0B0B0A" stroke-width="2"/>
        <ellipse cx="106" cy="76" rx="7.5" ry="10.5" fill="url(#bodyGrad)"/>
        <path d="M106,66 L106,86 M99,76 L113,76 M101,69 L111,83 M111,69 L101,83" stroke="#191714" stroke-width="1.2" opacity="0.6" fill="none"/>
        <ellipse cx="106" cy="76" rx="2.6" ry="3.6" fill="#D4AF37"/>
      </g>
      <!-- rear wheel -->
      <g id="wheel-rear">
        <ellipse cx="200" cy="71" rx="13" ry="17" fill="#0B0B0A"/>
        <ellipse cx="200" cy="71" rx="10" ry="14" fill="#191714" stroke="#0B0B0A" stroke-width="2"/>
        <ellipse cx="200" cy="71" rx="6.5" ry="9.5" fill="url(#bodyGrad)"/>
        <path d="M200,62 L200,80 M194,71 L206,71" stroke="#191714" stroke-width="1.2" opacity="0.6" fill="none"/>
        <ellipse cx="200" cy="71" rx="2.2" ry="3.1" fill="#D4AF37"/>
      </g>
    </g>
  </g>

  <!-- ============ BANNER ============ -->
  <g id="banner">
    <rect x="148" y="394" width="216" height="24" rx="3" fill="#0B0B0A" stroke="url(#goldMetal)" stroke-width="1.6"/>
    <text x="256" y="410.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#F7F5EF">JABALPUR, MADHYA PRADESH</text>
  </g>

  <!-- ============ CIRCULAR TEXT ============ -->
  <g id="typography" font-family="Georgia, 'Times New Roman', serif" font-weight="700">
    <text font-size="42" letter-spacing="5" fill="url(#goldText)">
      <textPath xlink:href="#arcTop" startOffset="50%" text-anchor="middle">JABALPUR</textPath>
    </text>
    <text font-size="17" letter-spacing="3" fill="#D4AF37">
      <textPath xlink:href="#arcBottom" startOffset="50%" text-anchor="middle">CAR RENTAL TAXI SERVICE</textPath>
    </text>
  </g>

  <!-- ============ SEPARATORS ============ -->
  <g id="ornaments" fill="#D4AF37">
    <polygon points="50,248 56,256 50,264 44,256"/>
    <polygon points="462,248 468,256 462,264 456,256"/>
    <circle cx="50" cy="234" r="2"/><circle cx="50" cy="278" r="2"/>
    <circle cx="462" cy="234" r="2"/><circle cx="462" cy="278" r="2"/>
  </g>
</svg>